<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTH — 3D TWIN / REAL MODEL</title>
<style>
  :root{ --acc:#e8c400; --ink:#141414; --panel:#f2f2ee; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; background:#dcdcd4; color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header{ display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:2px solid var(--ink); flex-wrap:wrap; }
  .logo{ font-weight:900; letter-spacing:.12em; font-size:17px; }
  .logo b{ background:var(--ink); color:var(--acc); padding:2px 8px; margin-right:8px; }
  .tag{ font-family:monospace; font-size:11px; border:1px solid var(--ink); padding:3px 8px; background:#fff; }
  main{ flex:1; display:grid; grid-template-columns:1fr 300px; min-height:0; }
  @media (max-width:760px){ main{ grid-template-columns:1fr; grid-template-rows:1fr auto; } }
  #view{ position:relative; background:#e6e6df; }
  #view canvas{ display:block; }
  #loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:monospace; font-size:13px; letter-spacing:.1em; }
  aside{ background:var(--panel); border-left:2px solid var(--ink); padding:14px; overflow:auto; }
  h2{ font-size:11px; letter-spacing:.2em; border-bottom:2px solid var(--ink); padding-bottom:6px; margin:14px 0 10px; }
  h2:first-child{ margin-top:0; }
  .selname{ font-size:19px; font-weight:900; word-break:break-all; }
  .selmeta{ font-family:monospace; font-size:12px; margin-top:6px; line-height:1.8; }
  .note{ font-size:11px; line-height:1.7; opacity:.85; margin-top:8px; }
  .plist{ display:flex; flex-direction:column; gap:4px; }
  .plist button{ text-align:left; font:inherit; font-size:12px; background:#fff; border:1px solid var(--ink); padding:6px 9px; cursor:pointer; word-break:break-all; }
  .plist button.sel{ background:var(--ink); color:var(--acc); }
  footer{ display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-top:2px solid var(--ink); flex-wrap:wrap; }
  footer label{ font-size:11px; letter-spacing:.15em; font-weight:700; }
  input[type=range]{ accent-color:var(--ink); }
  .btn{ font:inherit; font-size:12px; font-weight:700; background:var(--ink); color:#fff; border:none; padding:8px 14px; cursor:pointer; }
  .btn.alt{ background:#fff; color:var(--ink); border:1px solid var(--ink); }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>
<header>
  <div class="logo"><b>HTH</b>3D TWIN</div>
  <div class="tag">REAL MODEL / STEP → GLB</div>
  <div class="tag" id="modelInfo">読込中…</div>
</header>
<main>
  <div id="view"><div id="loading">LOADING MODEL…</div></div>
  <aside>
    <h2>SELECTED PART</h2>
    <div class="selname" id="selName">未選択</div>
    <div class="selmeta" id="selMeta">3D側のパーツ、または右の一覧から選んでください。</div>
    <p class="note">実機モデル（STEP）をそのまま変換した実寸モデルです。全高 約340mm／総体積 約1,087cm³（45パーツ）。サーボIDとの対応表は未設定で、今後ここに割り当てていきます。関節軸の定義が入れば、このモデルでポーズのFKプレビューまで進めます。</p>
    <h2>PARTS</h2>
    <div class="plist" id="plist"></div>
  </aside>
</main>
<footer>
  <label>分解</label>
  <input type="range" id="explode" min="0" max="100" value="0" style="width:180px;">
  <button class="btn alt" id="spinBtn">自動回転 OFF</button>
  <button class="btn" id="animBtn">分解アニメ</button>
</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const view = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6e6df);
const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 2.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(0.6, 1.2, 0.8); scene.add(key);
const fill = new THREE.DirectionalLight(0xfff2c0, 0.7); fill.position.set(-0.8, 0.4, -0.6); scene.add(fill);

function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

let manifest = {};
try{
  const mj = await (await fetch('robot.glb.manifest.json')).json();
  for(const p of mj) manifest[p.node] = p;
}catch(e){}

const b64parts = await Promise.all([
  fetch('robot.glb.b64.part-aa').then(r=>r.text()),
  fetch('robot.glb.b64.part-ab').then(r=>r.text()),
  fetch('robot.glb.b64.part-ac').then(r=>r.text()).catch(()=> ''),
]);
const b64 = b64parts.join('');
const bin = atob(b64.trim());
const bytes = new Uint8Array(bin.length);
for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
const url = URL.createObjectURL(new Blob([bytes], { type:'model/gltf-binary' }));

const loader = new GLTFLoader();
const gltf = await loader.loadAsync(url);
const model = gltf.scene;
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
model.position.y -= box.min.y;
const grid = new THREE.GridHelper(Math.max(size.x, size.z) * 2.2, 22, 0x141414, 0xb9b9ae);
scene.add(grid);
camera.position.set(center.x + size.x * 1.4, size.y * 0.9, center.z + size.z * 2.4);
controls.target.set(center.x, size.y * 0.5, center.z);
document.getElementById('modelInfo').textContent =
  '全高 ' + Math.round(size.y * 1000) + 'mm / 幅 ' + Math.round(size.x * 1000) + 'mm / 奥行 ' + Math.round(size.z * 1000) + 'mm';
document.getElementById('loading').style.display = 'none';

const parts = [];
model.traverse(o=>{
  if(o.isMesh){
    o.material = new THREE.MeshStandardMaterial({ color:0xd8d8d2, roughness:0.55, metalness:0.25 });
    const b = new THREE.Box3().setFromObject(o);
    const c = b.getCenter(new THREE.Vector3());
    const dir = c.clone().sub(center); dir.y *= 0.6;
    if(dir.lengthSq() < 1e-6) dir.set(0, 1, 0);
    dir.normalize();
    parts.push({ mesh:o, name:o.name, home:o.position.clone(), dir });
  }
});
parts.sort((a,b)=>a.name.localeCompare(b.name, 'ja'));

const plist = document.getElementById('plist');
let selected = null;
const btns = {};
for(const p of parts){
  const b = document.createElement('button');
  b.textContent = (manifest[p.name]?.name || p.name);
  b.onclick = ()=>select(p);
  plist.appendChild(b);
  btns[p.name] = b;
}
function select(p){
  if(selected) selected.mesh.material.color.set(0xd8d8d2);
  selected = p;
  for(const k in btns) btns[k].classList.toggle('sel', btns[k] === btns[p.name]);
  if(p){
    p.mesh.material.color.set(0xe8c400);
    const m = manifest[p.name];
    document.getElementById('selName').textContent = m?.name || p.name;
    document.getElementById('selMeta').innerHTML = m
      ? '体積 ' + m.volume_cm3 + ' cm³<br>寸法 ' + m.size_mm.join(' × ') + ' mm<br>サーボ対応: 未設定'
      : 'サーボ対応: 未設定';
  }
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e=>{
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(parts.map(p=>p.mesh), false)[0];
  if(hit) select(parts.find(p=>p.mesh === hit.object));
});

let explodeTarget = 0, explodeCur = 0, animating = false;
document.getElementById('explode').addEventListener('input', e=>{ explodeTarget = e.target.value / 100; animating = false; });
const animBtn = document.getElementById('animBtn');
animBtn.onclick = ()=>{
  animating = !animating;
  animBtn.textContent = animating ? 'アニメ停止' : '分解アニメ';
};
const spinBtn = document.getElementById('spinBtn');
spinBtn.onclick = ()=>{
  controls.autoRotate = !controls.autoRotate;
  spinBtn.textContent = '自動回転 ' + (controls.autoRotate ? 'ON' : 'OFF');
};

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  if(animating){
    explodeTarget = (Math.sin(t * 0.7) + 1) / 2;
    document.getElementById('explode').value = explodeTarget * 100;
  }
  explodeCur += (explodeTarget - explodeCur) * 0.12;
  const maxDim = Math.max(size.x, size.y, size.z);
  for(const p of parts){
    p.mesh.position.copy(p.home).addScaledVector(p.dir, explodeCur * maxDim * 0.55);
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
